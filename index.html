    <!-- Suppression stricte du tiroir et widget publicitaire Netlify -->
    <style>
      netlify-drawer,
      #netlify-drawer,
      [data-netlify-drawer],
      [class*="netlify-drawer"],

        z-index: -9999 !important;

    </style>
    <script>
      (function() {
        function removeNetlifyWidgets() {
          var selectors = [
            'netlify-drawer',
            '#netlify-drawer',
            '[data-netlify-drawer]',
            '[class*="netlify-drawer"]',
            '[id*="netlify-drawer"]',
            '[data-netlify-badge]',
            'iframe[src*="netlify"]',
            'iframe[title*="Netlify"]',
            'iframe[id*="netlify"]',
            'div[id*="netlify-feedback"]'
          ];
          for (var i = 0; i < selectors.length; i++) {
            var elements = document.querySelectorAll(selectors[i]);
            for (var j = 0; j < elements.length; j++) {
              try { elements[j].remove(); } catch(e) {}
            }
          }
        }
        removeNetlifyWidgets();
        document.addEventListener('DOMContentLoaded', removeNetlifyWidgets);
        window.addEventListener('load', removeNetlifyWidgets);
        var observer = new MutationObserver(function() {
          removeNetlifyWidgets();
        });
        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
